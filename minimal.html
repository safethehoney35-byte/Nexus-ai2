<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus AI — Minimal</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#eaf0ff;background:#0b1020}*{box-sizing:border-box}body{margin:0;padding:22px}.wrap{max-width:760px;margin:auto}.card{background:#141c31;border:1px solid #283552;border-radius:14px;padding:18px;margin:14px 0}h1{font-size:24px;margin:0 0 5px}.muted{color:#9eacc8;font-size:13px}label{display:block;font-size:13px;margin:12px 0 6px;color:#c5d1e8}input,textarea{width:100%;background:#0d1426;color:#fff;border:1px solid #344362;border-radius:9px;padding:11px;font:inherit}textarea{min-height:100px;resize:vertical}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer;background:#526bff;color:white}button.stop{background:#a83b4b}button.no{background:#46516b}button:disabled{opacity:.45;cursor:not-allowed}.status{display:inline-flex;align-items:center;gap:8px;font-weight:700}.dot{width:10px;height:10px;border-radius:50%;background:#e14b5a;display:inline-block}.dot.run{background:#27d17f}.dot.wait{background:#f0bd4c}.item{border-top:1px solid #293653;padding:12px 0}.item:first-child{border-top:0}.pill{font-size:11px;padding:3px 7px;border-radius:20px;background:#263552;color:#cbd7f0}.yes{color:#54e19a}.nope{color:#ff7884}.match{font-size:12px;color:#aebbd5;margin:6px 0}.actions{display:flex;gap:7px;margin-top:8px}.actions button{font-size:12px;padding:7px 11px}.log{max-height:180px;overflow:auto;font:12px/1.6 ui-monospace,monospace;color:#b8c6df}.log div{border-bottom:1px solid #25314a;padding:4px 0}.error{color:#ff8b96}.small{font-size:12px}
</style></head>
<body><main class="wrap">
<header><h1>Nexus AI</h1><div class="muted">Minimal element detector</div></header>
<section class="card">
<div class="status"><span id="dot" class="dot"></span><span id="statusText">Stopped</span></div>
<label for="url">Website link</label><input id="url" type="url" placeholder="https://example.com">
<label for="selectors">Elements to detect — CSS selectors (one per line)</label><textarea id="selectors" placeholder="#login-button&#10;.continue-button&#10;[data-testid='submit-button']"></textarea>
<div class="row"><button id="startBtn" onclick="start()">Start</button><button id="stopBtn" class="stop" onclick="stop()" disabled>Stop</button></div>
<div id="notice" class="muted" style="margin-top:10px">Use public website URLs. Private/local network links are blocked.</div>
</section>
<section class="card"><h3 style="margin:0 0 8px">Detected elements</h3><div class="muted small" id="summary">No scan yet.</div><div id="results" style="margin-top:10px"></div></section>
<section class="card"><h3 style="margin:0 0 8px">Activity log</h3><div id="log" class="log">Ready.</div></section>
</main>
<script>
const $=id=>document.getElementById(id);let wasRunning=false;let lastSignature='';
function log(msg){const line=document.createElement('div');line.textContent=new Date().toLocaleTimeString()+' — '+msg;$('log').prepend(line)}
function setStatus(running,message,error){$('dot').className='dot '+(running?'run':error?'':'');$('statusText').textContent=message|| (running?'Running':'Stopped');$('startBtn').disabled=running;$('stopBtn').disabled=!running;if(error)$('dot').className='dot';}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({detail:'Server returned an unreadable response'}));if(!r.ok)throw new Error(d.detail||'Request failed');return d}
async function start(){const url=$('url').value.trim();const selectors=$('selectors').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!url||!selectors.length){$('notice').textContent='Enter a public URL and at least one CSS selector.';return}try{$('notice').textContent='Starting browser…';setStatus(false,'Starting…');const d=await api('/api/start',{url,selectors});log('Browser started: '+d.url);$('notice').textContent='Monitoring page changes.';await refresh()}catch(e){$('notice').textContent=e.message;setStatus(false,'Error',true);log('ERROR: '+e.message)}}
async function stop(){try{await api('/api/stop',{});setStatus(false,'Stopped');$('results').innerHTML='';$('summary').textContent='Monitoring stopped.';log('Browser stopped.')}catch(e){log('ERROR: '+e.message)}}
async function approve(selector,index){if(!confirm('Approve clicking this ordinary button?')){log('Click rejected by user.');return}try{const d=await api('/api/click',{selector,index});log(d.message);await refresh()}catch(e){log('Click blocked/failed: '+e.message)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(s){const results=s.results||[];const total=results.reduce((n,x)=>n+x.count,0);$('summary').textContent=`${results.filter(x=>x.detected).length}/${results.length} selectors detected · ${total} total matches`;const sig=JSON.stringify(results);if(sig!==lastSignature){lastSignature=sig;$('results').innerHTML='';for(const r of results){const box=document.createElement('div');box.className='item';const heading=document.createElement('div');heading.innerHTML=`<strong>${esc(r.selector)}</strong> <span class="pill">${r.detected?'DETECTED':'NOT FOUND'}</span>`;const meta=document.createElement('div');meta.className='match';meta.textContent=`Matches: ${r.count} · Visible: ${r.visible_count} · ${r.detection_only?'Detection only':''}`;box.append(heading,meta);for(const m of (r.matches||[])){const row=document.createElement('div');row.className='match';row.textContent=`#${m.index} · <${m.tag}> · ${m.visible?'Visible':'Hidden'} · ${m.enabled?'Enabled':'Disabled'} · ${m.text}`;box.append(row);if(r.detected&&m.visible&&m.enabled&&!r.detection_only){const controls=document.createElement('div');controls.className='actions';const yes=document.createElement('button');yes.textContent='YES — approve click';yes.onclick=()=>approve(r.selector,m.index);const no=document.createElement('button');no.className='no';no.textContent='NO';no.onclick=()=>log('Click rejected for '+r.selector);controls.append(yes,no);box.append(controls)}}$('results').append(box)}}}
async function refresh(){try{const s=await api('/api/status');setStatus(s.running,s.message,s.error);render(s);if(s.error)$('notice').textContent=s.error;if(s.running&&!wasRunning)log('Browser status: running');if(!s.running&&wasRunning)log('Browser status: stopped');wasRunning=s.running}catch(e){setStatus(false,'Server unavailable',true)}}
setInterval(refresh,700);refresh();
</script></body></html>
